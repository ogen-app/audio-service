name: ci

# Lint + test on every PR and push to main. The image is built and pushed to
# GHCR only after both test jobs (go, proto) pass, and only on main — never on
# PRs.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The engine shells out to ffmpeg/ffprobe; install them so the
      # end-to-end audioengine tests run instead of skipping.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go' | grep -v '^gen/'))"
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi

      # All application logging goes through log/slog (CON-107). Boot log.Fatal*
      # in cmd/audio-service is allowed; log.Print/Printf/Println calls are not.
      # Anchored on the call paren so prose mentions of the funcs don't trip it.
      - name: forbid stdlib log.Print calls
        run: |
          if git grep -nE 'log\.Print(ln|f)?\(' -- cmd internal; then
            echo "::error::use log/slog, not the stdlib log.Print/Printf/Println functions"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: bufbuild/buf-setup-action@v1

      # Verify the committed stubs under gen/ are in sync with the pinned
      # buf.build/ogen-app/proto contract (CON-220) — a drifted checkout means
      # someone bumped the contract without regenerating. Plugin versions are
      # pinned to those in the generated headers so regeneration is byte-identical.
      # audio.v1 is published (v1.2.0), so this gate is enforced: a drift or a
      # `make proto` failure blocks build-push (which needs: this job).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protoc-gen-go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify generated code is up to date
        run: |
          make proto
          if [ -n "$(git status --porcelain -- gen/)" ]; then
            echo "::error::gen/ is out of date — run 'make proto' and commit the result"
            git status --porcelain -- gen/
            git diff -- gen/
            exit 1
          fi

  # Build the image (without pushing) on PRs so a broken ffmpeg source build in
  # the Dockerfile surfaces before merge, and smoke-test the built binaries.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: audio-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test ffmpeg/ffprobe
        run: |
          docker run --rm --entrypoint sh audio-service:ci -c '
            ffmpeg -hide_banner -version | head -1 &&
            ffprobe -hide_banner -version | head -1 &&
            ffmpeg -hide_banner -encoders | grep -q libopus &&
            ffmpeg -hide_banner -filters | grep -q silencedetect &&
            ffmpeg -hide_banner -protocols | grep -q https'

  # Every green main push publishes ghcr.io/ogen-app/audio-service:<build>,
  # where build is the commit count on main, then asks ogen-release to bump
  # audio-service to it.
  build-push:
    runs-on: ubuntu-latest
    # Gate the image on tests: this job won't start until both go and proto
    # succeed (needs implies success). Skip on PRs and on forks.
    needs: [go, proto]
    if: github.event_name == 'push' && github.repository_owner == 'ogen-app'
    # Runs of back-to-back merges can publish out of order: build 101 may push
    # and dispatch before build 100. Each build has its own tag, so the
    # registry doesn't care, and ogen-release ignores a bump to a build lower
    # than the one it holds.
    permissions:
      contents: read
      packages: write
    steps:
      # Full history: the build number is the commit count, which a shallow
      # clone reports as 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build number
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links the package to this repo, which is what lets
      # GITHUB_TOKEN push to it.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ogen-app/audio-service:${{ steps.build.outputs.number }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ogen-app/audio-service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Best effort: a missing ogen-release repo or token must not fail main.
      - name: Dispatch bump to ogen-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          BUILD: ${{ steps.build.outputs.number }}
        run: |
          gh api repos/ogen-app/ogen-release/dispatches \
            -f event_type=bump \
            -f 'client_payload[service]=audio-service' \
            -F "client_payload[build]=$BUILD" \
            -f "client_payload[revision]=$GITHUB_SHA"
